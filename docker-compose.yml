# Nexora production deployment topology.
#
# NODE_ENV=production is fail-fast: the backend requires PostgreSQL, Redis,
# SMTP and unique secrets. No demo data is seeded in production. Apply
# db/schema.sql with the one-shot migrate service before starting the backend.
# The in-process file/memory defaults are for local development via `npm start`.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nexora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-nexora}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nexora} -d ${POSTGRES_DB:-nexora}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot schema apply. Uses psql INSIDE the postgres image, so no PostgreSQL
  # client is needed on the host. Run explicitly:
  #   docker compose --profile migrate run --rm migrate
  migrate:
    image: postgres:16-alpine
    profiles: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nexora}
    volumes:
      - ./db/schema.sql:/schema.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["psql \"$$DATABASE_URL\" -v ON_ERROR_STOP=1 -f /schema.sql"]

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      PUBLIC_URL: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      API_BASE_URL: ${PUBLIC_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      DATA_STORE: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-nexora}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-nexora}
      QUEUE_DRIVER: redis
      REDIS_URL: redis://redis:6379
      QUEUE_CONCURRENCY: ${QUEUE_CONCURRENCY:-5}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
      FILE_ENCRYPTION_KEY: ${FILE_ENCRYPTION_KEY:?Set FILE_ENCRYPTION_KEY in .env}
      SMTP_URL: ${SMTP_URL:?Set SMTP_URL in .env}
      SMTP_FROM: ${SMTP_FROM:-no-reply@localhost}
      DATA_FILE: /app/.data/nexora.json
      BACKUP_DIR: /app/.data/backups
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      FILE_STORAGE: ${FILE_STORAGE:-local}
      FILE_DIR: ${FILE_DIR:-/app/.data/files}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_API_URL: ${AI_API_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-nexora-default}
    ports:
      - "4000:4000"
    volumes:
      - nexora-data:/app/.data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  postgres-data:
  redis-data:
  nexora-data:
